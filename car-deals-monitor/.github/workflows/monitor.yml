name: Monitor de coches

on:
  schedule:
    # Cada 2 horas (UTC). Ajusta a tu gusto: https://crontab.guru
    - cron: "0 */2 * * *"
  workflow_dispatch: {}   # permite lanzarlo manualmente desde la pestaña Actions

permissions:
  contents: write   # necesario para commitear el estado actualizado

concurrency:
  group: car-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar monitor
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PYTHONPATH: src
        run: python -m cardeals --config config.yaml --verbose

      - name: Guardar estado (anuncios ya vistos)
        if: always()
        run: |
          if [[ -n "$(git status --porcelain data/seen.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/seen.json
            git commit -m "chore: actualizar estado de anuncios vistos [skip ci]"
            git push
          else
            echo "Sin cambios en el estado."
          fi
